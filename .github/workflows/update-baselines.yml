name: Update visual baselines

# Manual only. Visual baselines must be captured by the same machine that later compares
# against them, so they are produced here and committed back, never generated locally.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to re-baseline and push the result to"
        required: true
        type: string

# Never cancelled mid-flight, for the same reason deploy's publish job is not: this run
# commits and pushes baselines, and killing it can leave the branch half-updated.
# `github.head_ref` is empty on a `workflow_dispatch`, so the group used to collapse to the
# commit SHA and a second dispatch cancelled the first — observed, not guessed: two
# dispatches five seconds apart on `main` left the earlier run `cancelled`. Keyed on the ref
# instead, a later dispatch for the same ref waits for the run in flight rather than killing
# it.
concurrency:
  group: update-baselines-${{ inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-baselines:
    name: update-baselines
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      VISUAL_CONTAINER: "1"
      LEFTHOOK: "0"
      # Read into the shell through the environment rather than interpolated into a `run:`
      # body — an expression pasted straight into a script is a command-injection hole,
      # and codeql.yml's `actions` language flags it.
      REF: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      # A checkout inside `container:` is owned by a different uid than the one the later
      # steps run as, so any git command in the tree fails with "detected dubious
      # ownership" — including the `lefthook install` that package.json's prepare script
      # runs during the install below.
      - name: Trust the workspace checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - run: npm i -g pnpm@11.20.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:test

      - run: pnpm test:visual --update-snapshots

      # Commit only when the bytes actually moved. A run that re-captures identical
      # baselines must leave main's HEAD alone — that no-op is what proves the container
      # is deterministic run to run, so it must not be papered over with an empty commit.
      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/visual/baselines
          if git diff --cached --quiet; then
            echo "baselines unchanged"
          else
            git commit -m "Update visual baselines from CI"
            git push origin "HEAD:$REF"
          fi
