name: PR title

# `edited` is mandatory, not tidiness: main squash-merges with the PR title as the commit
# message (docs/rules/general/toolchain.md R012), so this is a required check — and
# without `edited` a retitle never re-runs it and the PR stays unmergeable forever.
# `pull_request`, not `pull_request_target`: every PR here is same-repo, so the elevated
# token would buy nothing and cost the usual fork-safety risk.
on:
  pull_request:
    types: [opened, edited, synchronize]

concurrency:
  group: pr-title-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            test
            ci
            refactor
            build
            perf
          # A solo repo with one package: a scope would be noise on most changes, and a
          # required scope turns every retitle into a second round trip.
          requireScope: false
