name: Sonar

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: sonar-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Deliberately inert until SONAR_TOKEN exists, and deliberately never a required check:
  # a third-party analysis service must not be able to block a merge by being down, and an
  # unconfigured one must not be able to block it by being absent. Every step past the
  # announcement is gated on the token, so an unconfigured repo spends no minutes here.
  sonar:
    name: sonar
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Announce skip
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN missing — skipping"

      # Sonar attributes issues to authors through git blame, which a shallow clone
      # cannot supply.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.SONAR_TOKEN != ''

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.SONAR_TOKEN != ''
        with:
          node-version: "26"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: env.SONAR_TOKEN != ''
        env:
          LEFTHOOK: "0"

      # Its own coverage run rather than an artifact from ci.yml: this workflow must be
      # able to fail, be re-run, or be turned on later without depending on another
      # workflow's retention window. sonar-project.properties points at coverage/unit.
      - run: pnpm test:unit:coverage
        if: env.SONAR_TOKEN != ''

      - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
