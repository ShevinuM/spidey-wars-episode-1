name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # On a push event github.head_ref is empty, so without the fallback every push to
  # main would share one group under cancel-in-progress: true, and a second merge
  # would cancel the first merge's coverage upload.
  group: ci-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides whether the container-only visual suite has anything to look at. It is a
  # required context in its own right: a `visual` job skipped because this job *failed*
  # still reports SKIPPED, and a skipped job satisfies a required check — so a broken
  # filter would silently unblock every merge unless this job is required too.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # dorny/paths-filter asks the API for a pull request's changed files.
      pull-requests: read
    outputs:
      visual: ${{ steps.filter.outputs.visual }}
    steps:
      # On push the filter compares against an explicit base SHA, which makes it diff
      # locally instead of through the API — so the history has to be present.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Set only for push, where it means "the previous commit on main", so a merge
          # that touches a visual path re-runs the suite. On a pull_request event
          # github.event.before does not exist and an empty base leaves the action's own
          # base detection (the PR's merge base) in charge.
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            visual:
              - 'src/scenes/**'
              - 'src/ui/**'
              - 'src/cutscene/**'
              - 'src/config/**'
              - 'test/visual/**'
              - 'test/support/**'
              - 'public/**'
              - 'Dockerfile.visual'
              - 'playwright.config.ts'

  # Cheapest-first: static checks before anything that needs a build, and a build before
  # anything that needs a browser. A failure earlier in the list saves the minutes the
  # later stages would have spent.
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (full history) rather than the default shallow clone: Gitleaks
      # scans the event's commit range, which a depth-1 checkout does not contain.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # First, and before anything is installed: a malformed workflow file should fail in
      # seconds rather than after the long half of this job. actionlint ships no usable
      # npm CLI, so it cannot be resolved through pnpm like every other tool here
      # (docs/rules/general/toolchain.md R008); pinning the release by version *and*
      # SHA-256 makes this step as reproducible as a SHA-pinned action, and it depends on
      # no third-party action at all. See lefthook.yml for the same exception locally.
      - name: Lint workflows
        run: |
          curl -fsSL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color
          rm -f actionlint actionlint.tar.gz

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          # package.json's prepare script runs `lefthook install`. CI has no use for git
          # hooks, and every check they would run is a step in this job already.
          LEFTHOOK: "0"

      # Secrets: Gitleaks is the blocking scanner, backed by GitHub's native (free,
      # already-on) secret scanning as a second, non-blocking net. Pinned to the v2 line
      # rather than the released v3.0.0 — v2's config surface is long-documented and
      # stable, and a secret-scan step whose behavior we are guessing at is a green check
      # asserting nothing. Dependabot will propose the v3 bump with a changelog to read.
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dependencies: Trivy is the single blocking scanner for known-vulnerable
      # dependencies. scanners: vuln only — its secret scanner would duplicate Gitleaks,
      # and its misconfig scanner is owned by trivy-image.yml for the one container this
      # repo has. ignore-unfixed drops findings upstream has no fix for at all; anything
      # that survives and has no bump path is accepted explicitly in .trivyignore.
      - name: Trivy dependency vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm architecture
      - run: pnpm format
      - run: pnpm duplication
      - run: pnpm knip

      - run: pnpm test:unit:coverage

      # Both builds are needed before the browser suites: playwright.config.ts's webServer
      # entries *serve* dist and dist-test, they do not build them. smoke reads dist,
      # e2e reads dist-test.
      - run: pnpm build
      - run: pnpm build:test

      # Bundle budget, against dist only — dist-test is 12M of which 11M is sourcemap.
      - run: pnpm size

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm playwright:install

      - run: pnpm test:smoke
      - run: pnpm test:e2e

      - run: pnpm coverage:merge

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The visual suite exists only inside the pinned container: playwright.config.ts
  # registers the `visual` project only when VISUAL_CONTAINER=1, and without it the run
  # fails with `Project(s) "visual" not found` rather than skipping. Baselines are
  # captured against this exact image, so the image tag and @playwright/test are pinned
  # to the identical string and bumped together.
  visual:
    name: visual
    needs: [changes]
    if: needs.changes.outputs.visual == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      VISUAL_CONTAINER: "1"
      LEFTHOOK: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A checkout inside `container:` is owned by a different uid than the one the later
      # steps run as, so any git command in the tree fails with "detected dubious
      # ownership". package.json's prepare script runs `lefthook install`, which is a git
      # command — so this has to come before the install, not before a later git step.
      - name: Trust the workspace checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The image ships Node and the browsers, not pnpm, and it is deliberately not a
      # pnpm/action-setup job — the whole point is to run under the image's own toolchain.
      - run: npm i -g pnpm@11.20.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm build:test

      - run: pnpm test:visual

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-results
          path: test-results/
          retention-days: 7
