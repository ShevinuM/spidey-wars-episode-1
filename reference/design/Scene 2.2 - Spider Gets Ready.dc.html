<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet" />
<style>
  html, body { height: 100%; margin: 0; background: #060d22; }
  a { color: #f2a93b; text-decoration: none; }
  a:hover { color: #ffd27a; }
  img { image-rendering: pixelated; -webkit-user-drag: none; }
  @keyframes blink { 0%, 60% { opacity: 1 } 61%, 100% { opacity: .25 } }
  @keyframes coil { 0%, 100% { transform: translate(0, 0) } 50% { transform: translate(-2px, 3px) } }
  @keyframes dust { 0% { opacity: .5; transform: translateX(0) scaleX(1) } 100% { opacity: 0; transform: translateX(46px) scaleX(1.6) } }
  @keyframes speedline { 0% { opacity: 0; transform: translateX(40px) } 20% { opacity: .8 } 100% { opacity: 0; transform: translateX(-30px) } }
  @keyframes aimPulse { 0%, 100% { opacity: .35; transform: scale(1) } 50% { opacity: .9; transform: scale(1.12) } }
  @keyframes nudge { 0%, 100% { transform: translateX(0) } 50% { transform: translateX(-5px) } }
</style>
</helmet>
<div style="width: 100%; height: 100%; position: relative; font-family: 'Silkscreen', monospace; display: flex; flex-direction: column; box-sizing: border-box;">

  <div style="background: #4a9fd8; padding: 4px; clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px); flex: 1; display: flex; flex-direction: column; min-height: 0; box-sizing: border-box;">
  <div style="background: #0b1c3f; padding: 8px; clip-path: polygon(9px 0, calc(100% - 9px) 0, 100% 9px, 100% calc(100% - 9px), calc(100% - 9px) 100%, 9px 100%, 0 calc(100% - 9px), 0 9px); flex: 1; display: flex; flex-direction: column; min-height: 0; box-sizing: border-box;">
  <div style="background: #1a4f82; padding: 3px; position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; box-sizing: border-box;">

    <div style="position: relative; width: 100%; flex: 1 0 auto; min-height: 510px; overflow: hidden; background: linear-gradient(180deg, #04081c 0%, #071130 30%, #0d1c45 58%, #16274f 82%, #223256 100%);">

      <!-- STARS + MOON -->
      <div style="position: absolute; inset: 0; pointer-events: none;">
        <div style="position: absolute; left: 40px; top: 26px; width: 3px; height: 3px; background: #dbe9ff; box-shadow: {{ starsShadow }};"></div>
        <div style="position: absolute; right: 84px; top: 52px; width: 52px; height: 52px; border-radius: 50%; background: #e8f0ff; box-shadow: 0 0 54px 18px rgba(150, 190, 255, .2);"></div>
        <div style="position: absolute; right: 112px; top: 66px; width: 9px; height: 9px; background: #c9d8f2;"></div>
      </div>

      <!-- FAR SKYLINE (full-bleed, extends to ground so the rooftop reads as high above a real city) -->
      <div style="position: absolute; left: -100px; right: -100px; bottom: 0; height: 252px; display: flex; align-items: flex-end; gap: 6px; opacity: .75; pointer-events: none;">
        <sc-for list="{{ farBuildings }}" as="b" hint-placeholder-count="90">
          <div style="width: {{ b.w }}px; height: {{ b.h }}px; background: #0e1c44; flex: none;"></div>
        </sc-for>
      </div>

      <!-- MID SKYLINE (full-bleed, extends to ground) -->
      <div style="position: absolute; left: -100px; right: -100px; bottom: 0; height: 234px; display: flex; align-items: flex-end; gap: 9px; pointer-events: none;">
        <sc-for list="{{ midBuildings }}" as="b" hint-placeholder-count="60">
          <div style="width: {{ b.w }}px; height: {{ b.h }}px; flex: none; background-color: #15275a; background-image: repeating-linear-gradient(180deg, transparent 0 3px, #15275a 3px 10px), repeating-linear-gradient(90deg, {{ b.window }} 0 3px, transparent 3px 10px); background-position: {{ b.bx }}px {{ b.by }}px; border-top: 2px solid #1d3474;"></div>
        </sc-for>
      </div>

      <!-- STREET HAZE (full-bleed, extends to ground) -->
      <div style="position: absolute; left: -100px; right: -100px; bottom: 0; height: 194px; background: linear-gradient(180deg, rgba(255, 176, 74, 0) 0%, rgba(255, 168, 74, .1) 55%, rgba(255, 190, 110, .26) 100%); pointer-events: none;"></div>

      <!-- STAGE -->
      <div style="position: absolute; left: 50%; top: 0; bottom: 0; width: 1080px; zoom: 0.66; transform: translateX(-50%); transform-origin: 50% 100%;">

        <!-- WATER TOWER (now behind him, he ran past it) -->
        <div style="position: absolute; left: 800px; bottom: 290px; width: 96px; height: 96px; background: #1c2d5c; box-shadow: inset 0 6px 0 #2f4c8c, inset -8px 0 0 rgba(6, 12, 32, .45);"></div>
        <div style="position: absolute; left: 788px; bottom: 386px; width: 120px; height: 20px; background: #263c72;"></div>
        <div style="position: absolute; left: 818px; bottom: 250px; width: 10px; height: 44px; background: #1b2a55;"></div>
        <div style="position: absolute; left: 868px; bottom: 250px; width: 10px; height: 44px; background: #1b2a55;"></div>

        <!-- ANTENNA -->
        <div style="position: absolute; left: 950px; bottom: 250px; width: 9px; height: 200px; background: #2a4076;"></div>
        <div style="position: absolute; left: 944px; bottom: 450px; width: 20px; height: 10px; background: #e8413a; animation: blink 1.4s steps(1, end) infinite;"></div>
        <div style="position: absolute; left: 934px; bottom: 380px; width: 40px; height: 6px; background: #2a4076;"></div>

        <!-- AC UNIT -->
        <div style="position: absolute; left: 662px; bottom: 250px; width: 104px; height: 62px; background: #22366b; box-shadow: inset 0 5px 0 #3a5c9e, inset -8px 0 0 rgba(6, 12, 32, .4);"></div>
        <div style="position: absolute; left: 678px; bottom: 312px; width: 34px; height: 14px; background: #2c4784;"></div>

        <!-- ROOF SLAB -->
        <div style="position: absolute; left: 200px; width: 1600px; bottom: 0; height: 250px;">
          <div style="position: absolute; left: 0; right: 0; top: 0; height: 30px; background: #33508f; box-shadow: inset 0 4px 0 #5d8fd6, inset 0 -5px 0 rgba(6, 12, 32, .5);"></div>
          <div style="position: absolute; left: 0; right: 0; top: 30px; bottom: 0; background-color: #16244a; background-image: repeating-linear-gradient(90deg, rgba(255, 255, 255, .035) 0 3px, transparent 3px 22px), repeating-linear-gradient(180deg, rgba(0, 0, 0, .3) 0 2px, transparent 2px 26px);"></div>
          <div style="position: absolute; left: 0; top: 0; width: 22px; bottom: 0; background: #0c1630;"></div>
          <div style="position: absolute; left: 22px; top: 30px; width: 10px; bottom: 0; background: rgba(120, 175, 230, .1);"></div>
        </div>

        <!-- SPRINT TRAIL HE LEFT BEHIND -->
        <sc-if value="{{ trailOn }}" hint-placeholder-val="{{ true }}">
          <div style="position: absolute; left: 0; bottom: 250px; width: 940px; height: 130px; pointer-events: none;">
            <sc-for list="{{ speedLines }}" as="s" hint-placeholder-count="6">
              <div style="position: absolute; left: {{ s.left }}px; bottom: {{ s.bottom }}px; width: {{ s.w }}px; height: 4px; background: rgba(160, 205, 245, .5); animation: speedline 0.6s linear infinite; animation-delay: {{ s.delay }}s;"></div>
            </sc-for>
            <sc-for list="{{ dustPuffs }}" as="p" hint-placeholder-count="4">
              <div style="position: absolute; left: {{ p.left }}px; bottom: 2px; width: {{ p.size }}px; height: {{ p.size }}px; background: rgba(150, 180, 220, .3); animation: dust 0.8s linear infinite; animation-delay: {{ p.delay }}s;"></div>
            </sc-for>
          </div>
        </sc-if>

        <!-- SPIDEY, COILED ON THE FAR EDGE, FACING LEFT -->
        <div style="position: absolute; left: 402px; bottom: 250px; width: 276px; height: 220px; animation: coil 0.5s steps(2, end) infinite;">
          <img src="sprites/spidey-crouch.png" style="position: absolute; left: 0; top: 0; width: 276px; height: 220px; display: block; transform: scaleX(-1);" alt="Spider-Man crouched on the far edge of the roof, facing left, coiled to launch" />
          <div style="position: absolute; left: -6px; top: 214px; width: 288px; height: 16px; background: radial-gradient(ellipse at center, rgba(6, 12, 32, .7) 0%, rgba(6, 12, 32, 0) 70%);"></div>

          <!-- HAND ON THE WEB-SHOOTER, AIM GLOW -->
          <div style="position: absolute; left: 196px; top: 16px; width: 64px; height: 64px; border-radius: 50%; box-shadow: 0 0 0 5px rgba(242, 169, 59, .5); animation: aimPulse 0.9s ease-in-out infinite;"></div>

          <!-- NAME TAG -->
          <div style="position: absolute; left: 96px; top: -50px; display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: #0f1c3c; box-shadow: 0 0 0 3px #4a9fd8;">
            <span style="width: 7px; height: 7px; background: #e8413a; display: block;"></span>
            <span style="font-size: 11px; color: #9ed8f5; letter-spacing: .1em;">SPIDEY</span>
          </div>
        </div>

      </div>

      <!-- AIM VECTOR: FOURTEEN BLOCKS THAT WAY -->
      <div style="position: absolute; left: max(24px, calc(50% - 596px)); top: 300px; z-index: 6; display: flex; align-items: center; gap: 10px; animation: nudge 1.1s ease-in-out infinite;">
        <span style="font-family: 'Press Start 2P', monospace; font-size: 16px; color: #f2a93b;">◀</span>
        <span style="font-size: 12px; color: #f2a93b; letter-spacing: .14em;">14 BLOCKS</span>
      </div>

      <!-- FAINT LAUGH STILL CARRYING OVER THE ROOFTOPS -->
      <div style="position: absolute; left: max(26px, calc(50% - 592px)); top: 230px; z-index: 6;">
        <span style="font-size: 13px; color: rgba(185, 140, 240, .7); letter-spacing: .22em; animation: blink 1.3s steps(1, end) infinite;">ha ha ha ha</span>
      </div>

      <!-- HUD: LAUNCH CHARGE -->
      <div style="position: absolute; right: 26px; bottom: 92px; z-index: 6; display: flex; flex-direction: column; align-items: flex-end; gap: 7px;">
        <span style="font-size: 11px; color: #9ed8f5; letter-spacing: .16em;">WEB-SHOOTERS</span>
        <div style="display: flex; gap: 3px; padding: 4px; background: #0f1c3c; box-shadow: 0 0 0 3px #4a9fd8;">
          <sc-for list="{{ chargeBars }}" as="bar" hint-placeholder-count="12">
            <span style="width: 9px; height: 16px; display: block; background: {{ bar.color }};"></span>
          </sc-for>
        </div>
        <span style="font-size: 11px; color: #f2a93b; letter-spacing: .16em; animation: blink 0.45s steps(1, end) infinite;">&gt; LAUNCH READY</span>
      </div>

      <!-- COMIC DIALOG BALLOON: SPIDEY -->
      <div style="position: absolute; right: max(20px, calc(50% - 430px)); top: 28px; width: min(340px, calc(50% - 40px)); min-width: 250px; z-index: 6;">
        <div style="position: relative; background: #f4f1e6; padding: 5px; box-shadow: 0 0 0 4px #16121c, 10px 12px 0 rgba(4, 10, 30, .55);">
          <div style="border: 3px solid #4a9fd8; padding: 17px 18px 19px; display: flex; flex-direction: column; gap: 13px;">
            <p style="margin: 0; font-size: 13px; line-height: 1.95; color: #16121c; letter-spacing: .02em; text-wrap: pretty;"><span style="font-family: 'Press Start 2P', monospace; font-size: 12px; color: #c2241d; line-height: 2.2;">DON'T.</span> Don't you <span style="font-weight: 700; color: #c2241d;">DARE</span>.</p>
            <p style="margin: 0; font-size: 13px; line-height: 1.95; color: #16121c; letter-spacing: .02em; text-wrap: pretty;">MJ — <em style="font-style: normal; font-weight: 700;">eyes on me.</em> I'm coming. Fourteen blocks, six swings, don't blink.</p>
            <p style="margin: 0; font-size: 13px; line-height: 1.95; color: #4a3f2e; letter-spacing: .02em; text-wrap: pretty;">oh god oh god oh god—</p>
          </div>
          <div style="position: absolute; left: -22px; bottom: 30px; width: 24px; height: 38px; background: #16121c; clip-path: polygon(100% 0, 100% 100%, 0 50%);">
            <div style="position: absolute; left: -1px; top: 5px; width: 19px; height: 28px; background: #f4f1e6; clip-path: polygon(100% 0, 100% 100%, 0 50%);"></div>
          </div>
        </div>
      </div>

      <!-- PRESS SPACE PLAQUE -->
      <sc-if value="{{ letterbox }}" hint-placeholder-val="{{ true }}">
        <div style="position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); pointer-events: none; z-index: 7;">
          <div style="background: #4a9fd8; padding: 3px; clip-path: polygon(7px 0, calc(100% - 7px) 0, 100% 7px, 100% calc(100% - 7px), calc(100% - 7px) 100%, 7px 100%, 0 calc(100% - 7px), 0 7px);">
            <div style="background: #12213f; padding: 11px 26px; display: flex; align-items: center; gap: 14px; clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px);">
              <span style="font-size: 13px; color: #9ed8f5; letter-spacing: .12em; animation: blink 0.9s steps(1, end) infinite;">◼ PRESS SPACE TO SWING</span>
            </div>
          </div>
        </div>
      </sc-if>

      <!-- SCANLINES + VIGNETTE -->
      <div style="position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(180deg, rgba(0, 0, 0, .16) 0 2px, rgba(0, 0, 0, 0) 2px 4px); mix-blend-mode: multiply;"></div>
      <div style="position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 130px 34px rgba(3, 7, 20, .68);"></div>

    </div>

  </div>
  </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showTrail&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Scene&quot;},&quot;chargeLevel&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:12,&quot;min&quot;:0,&quot;max&quot;:12,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Scene&quot;},&quot;showLetterbox&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Presentation&quot;}}">
class Component extends DCLogic {
  seedRand(seed) {
    let a = seed;
    return () => {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  renderVals() {
    const rand = this.seedRand(50218);
    const farBuildings = Array.from({ length: 90 }, () => ({
      w: Math.round(33 + rand() * 52),
      h: Math.round(53 + rand() * 92) + 94
    }));
    const windowTints = ['rgba(126, 190, 240, .5)', 'rgba(126, 190, 240, .42)', 'rgba(242, 200, 90, .32)'];
    const midBuildings = Array.from({ length: 60 }, () => ({
      w: Math.round(44 + rand() * 61),
      h: Math.round(57 + rand() * 74) + 94,
      window: windowTints[Math.floor(rand() * windowTints.length)],
      bx: Math.round(4 + rand() * 5),
      by: Math.round(7 + rand() * 3)
    }));
    const starPts = [];
    for (let i = 0; i < 44; i++) {
      const x = Math.round(rand() * 1500);
      const y = Math.round(rand() * 260);
      const c = rand() > 0.5 ? '#fff' : (rand() > 0.5 ? '#9fc4ff' : '#7fa8e8');
      starPts.push(x + 'px ' + y + 'px ' + c);
    }

    const speedLines = Array.from({ length: 7 }, (_, i) => ({
      left: Math.round(560 + rand() * 300),
      bottom: Math.round(24 + rand() * 96),
      w: Math.round(34 + rand() * 66),
      delay: (i * 0.08).toFixed(2)
    }));
    const dustPuffs = Array.from({ length: 5 }, (_, i) => ({
      left: Math.round(540 + rand() * 280),
      size: Math.round(10 + rand() * 14),
      delay: (i * 0.16).toFixed(2)
    }));

    const level = Math.round(this.props.chargeLevel ?? 12);
    const chargeBars = Array.from({ length: 12 }, (_, i) => ({
      color: i < level ? (i > 8 ? '#7de08a' : '#4a9fd8') : 'rgba(74, 159, 216, .22)'
    }));

    return {
      farBuildings,
      midBuildings,
      starsShadow: starPts.join(', '),
      speedLines,
      dustPuffs,
      chargeBars,
      trailOn: this.props.showTrail ?? true,
      letterbox: this.props.showLetterbox ?? true
    };
  }
}
</script>
</body>
</html>
